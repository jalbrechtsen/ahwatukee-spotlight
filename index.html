<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahwatukee Local Business Spotlight</title>
    <style>
        /* 1. Define our Color Variables */
        :root {
            --bg-color: #fcfcfc;
            --text-color: #333333;
            --header-bg: #d35400;
            --header-text: white;
            --header-border: #2c3e50;
            --card-bg: white;
            --card-title: #2c3e50;
            --tag-bg: #ecf0f1;
            --tag-text: #7f8c8d;
            --input-bg: white;
            --input-text: #333333;
            --input-border: #bdc3c7;
            --shadow: rgba(0,0,0,0.05);
            --hover-shadow: rgba(0,0,0,0.1);
        }

        /* 2. Define the Dark Mode Colors */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --header-bg: #1e1e1e;
            --header-text: #d35400; 
            --header-border: #d35400;
            --card-bg: #1e1e1e;
            --card-title: #ffffff;
            --tag-bg: #333333;
            --tag-text: #aaaaaa;
            --input-bg: #2a2a2a;
            --input-text: #ffffff;
            --input-border: #555555;
            --shadow: rgba(0,0,0,0.3);
            --hover-shadow: rgba(0,0,0,0.5);
        }

        /* 3. Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom: 5px solid var(--header-border);
            position: relative;
            transition: background-color 0.3s ease;
        }
        h1 { margin: 0 0 0.5rem 0; font-size: 2.2rem; }
        p.subtitle { margin: 0; font-size: 1.1rem; opacity: 0.9; }
        
        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: 2px solid currentColor;
            color: inherit;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            background: currentColor;
            color: var(--header-bg);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .search-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        #searchInput {
            width: 100%;
            max-width: 500px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 2px solid var(--input-border);
            border-radius: 25px;
            outline: none;
            transition: all 0.3s;
        }
        #searchInput:focus {
            border-color: #d35400;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px var(--shadow);
            border-top: 4px solid #d35400;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s;
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 12px var(--hover-shadow);
        }
        .card h3 { margin: 0 0 0.5rem 0; color: var(--card-title); font-size: 1.3rem;}
        .category-tag {
            align-self: flex-start;
            font-size: 0.75rem;
            background: var(--tag-bg);
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            color: var(--tag-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .address { font-size: 0.85rem; color: var(--tag-text); margin-bottom: 0.5rem; display: block; }
        .phone { font-size: 0.85rem; color: #d35400; font-weight: bold; margin-bottom: 1rem; display: block; }
        
        /* New Button Group Styling for Side-by-Side layout */
        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: auto; /* Pushes the buttons to the bottom of the card */
        }

        .contact-btn {
            flex: 1; /* Makes buttons share the width equally */
            text-align: center;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 0.6rem;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .contact-btn:hover { background-color: #219653; }
        .contact-btn.disabled { background-color: #95a5a6; cursor: not-allowed; }

        /* Custom color for the directions button */
        .directions-btn { background-color: #2980b9; }
        .directions-btn:hover { background-color: #2471a3; }

    </style>
</head>
<body>

    <header>
        <button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>
        <h1>Ahwatukee Local Business Spotlight</h1>
        <p class="subtitle">Discover and support your neighborhood independent services.</p>
    </header>

    <div class="container">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by name or category (e.g., Pizza, Plumber, Gym)...">
        </div>
        <div class="grid" id="business-grid"></div>
    </div>

    <script src="data1.js"></script>
    <script src="data2.js"></script>
    <script src="data3.js"></script>
    
    <script>
        // --- THEME TOGGLE LOGIC ---
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '🌙 Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '☀️ Light Mode';
            }
        });

        // --- GRID AND SEARCH LOGIC ---
        const grid = document.getElementById('business-grid');
        const searchInput = document.getElementById('searchInput');
        const allBusinesses = [...data1, ...data2, ...data3];

        function displayBusinesses(businessesToDisplay) {
            grid.innerHTML = ''; 
            businessesToDisplay.forEach(biz => {
                
                // 1. Build the Website Button
                let websiteBtnHtml = '';
                if (biz.website && biz.website !== "") {
                    websiteBtnHtml = `<a href="${biz.website}" target="_blank" class="contact-btn">Website</a>`;
                } else {
                    websiteBtnHtml = `<a class="contact-btn disabled">No Website</a>`;
                }

                // 2. Build the Directions Button
                // We use the address if they have one, otherwise we tell Google to just search the name + Ahwatukee
                let addressQuery = biz.address ? biz.address : (biz.title + ", Ahwatukee, AZ");
                let mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addressQuery)}`;
                let directionsBtnHtml = `<a href="${mapsUrl}" target="_blank" class="contact-btn directions-btn">Directions</a>`;

                // 3. Assemble the Card
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${biz.title}</h3>
                    <span class="category-tag">${biz.categoryName}</span>
                    <span class="address">${biz.address || 'Ahwatukee, AZ'}</span>
                    <span class="phone">${biz.phone || 'No phone listed'}</span>
                    
                    <div class="button-group">
                        ${websiteBtnHtml}
                        ${directionsBtnHtml}
                    </div>
                `;
                grid.appendChild(card); 
            });
        }

        searchInput.addEventListener('keyup', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredData = allBusinesses.filter(biz => {
                const matchesTitle = biz.title.toLowerCase().includes(searchTerm);
                const matchesCategory = biz.categoryName.toLowerCase().includes(searchTerm);
                return matchesTitle || matchesCategory;
            });
            displayBusinesses(filteredData);
        });

        displayBusinesses(allBusinesses);
    </script>
</body>
</html>
